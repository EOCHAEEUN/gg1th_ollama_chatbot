server {
    listen 80;
    listen [::]:80;

    server_name localhost;

    root /var/www/local_llm_app;
    index index.html;

    # React SPA: 새로고침 시 404가 나지 않도록 항상 index.html로 폴백
    location / {
        try_files $uri $uri/ /index.html;
    }

    # /api/* → FastAPI(127.0.0.1:8000)
    # proxy_pass 끝의 '/'가 /api 접두사를 제거한다.
    #   /api/models → http://127.0.0.1:8000/models
    #   /api/chat   → http://127.0.0.1:8000/chat
    location /api/ {
        proxy_pass http://127.0.0.1:8000/;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 로컬 LLM 응답이 길어질 수 있으므로 타임아웃을 넉넉히
        proxy_read_timeout 300;
        proxy_connect_timeout 300;
        proxy_send_timeout 300;
    }
}
